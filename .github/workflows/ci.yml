# CI: lint + format check + unit tests everywhere + integration tests against
# a real Postgres service (plan §14 — locking/transaction claims are never
# verified against pg-mem) + client build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventrelay
          POSTGRES_PASSWORD: eventrelay
          POSTGRES_DB: eventrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No .env file in CI — everything comes from here.
      DATABASE_URL: postgres://eventrelay:eventrelay@localhost:5432/eventrelay
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit + integration tests
        run: npm test

      - name: Build client
        run: npm run build:client

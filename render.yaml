# Render Blueprint — FREE single-service variant (testing only).
# This is the DEFAULT render.yaml on purpose: Render auto-reads it the
# moment you connect the repo, and since it contains only a free web
# service, no payment prompt appears. Render has no free tier for
# background workers, so this runs the API, BullMQ worker, sweeper and
# outbox dispatcher inside ONE free web service via RUN_BACKGROUND=true.
#
# Trade-offs vs render.paid.yaml (the paid, recommended production setup):
# - Free web services sleep after ~15 min idle → deliveries pause until
#   the next API request wakes the service (cold start ~30-50s).
# - A restart kills in-flight deliveries; the lease + sweeper recover
#   them, so nothing is lost, but expect delays.
# - API and worker share one process/CPU — fine for testing, not scale.
#
# Usage: Render → New → Blueprint → select this repo → Deploy.
# (For the paid 3-service production setup, use Blueprint Path:
# render.paid.yaml instead — that one triggers the payment prompt.)
services:
  - type: web
    name: eventrelay
    plan: free
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    # No dockerCommand: Render treats it as a single program name, so
    # shell operators (&&) fail with "not found". The Dockerfile CMD
    # (exec form) runs migrations + the server; RUN_BACKGROUND below
    # enables the embedded worker/dispatcher.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: RUN_BACKGROUND
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_URL
        sync: false  # your Vercel URL, set after frontend deploy
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false  # same process signs + verifies, so just needs to be set

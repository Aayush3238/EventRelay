# Render Blueprint — FREE single-service variant (testing only).
# Render has no free tier for background workers, so this runs the API,
# BullMQ worker, sweeper and outbox dispatcher inside ONE free web service
# via RUN_BACKGROUND=true. No payment method required.
#
# Trade-offs vs render.yaml (the paid, recommended production setup):
# - Free web services sleep after ~15 min idle → deliveries pause until
#   the next API request wakes the service (cold start ~30-50s).
# - A restart kills in-flight deliveries; the lease + sweeper recover
#   them, so nothing is lost, but expect delays.
# - API and worker share one process/CPU — fine for testing, not scale.
#
# Usage: Render → New → Blueprint → Blueprint Path: render.free.yaml
# (instead of the default render.yaml).
services:
  - type: web
    name: eventrelay
    plan: free
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "node db/migrate.js && RUN_BACKGROUND=true node api/src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: RUN_BACKGROUND
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_URL
        sync: false  # your Vercel URL, set after frontend deploy
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false  # same process signs + verifies, so just needs to be set

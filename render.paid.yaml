# Render Blueprint — EventRelay backend, PAID production setup
# (API + worker + dispatcher as 3 separate services).
# Usage: Render Dashboard → New → Blueprint → select this repo →
# Blueprint Path: render.paid.yaml → it creates the 3 services below.
# ⚠️ This blueprint requires a payment method on file (starter workers
# have no free tier). For a no-card deploy, use the default render.yaml.
# Then paste the secret values in the dashboard
# (keys marked `sync: false` are NOT taken from this file).
# NOTE: the API runs on the free plan (spins down after inactivity =
# cold starts). Render has NO free tier for background workers, so
# worker + dispatcher are pinned to `starter` (~$7/mo each) — a
# worker that sleeps would leave deliveries stuck in `processing`.
services:
  - type: web
    name: eventrelay-api
    plan: free
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    # No dockerCommand (Render would treat it as one program name).
    # The Dockerfile CMD runs migrations (idempotent) before serving.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_URL
        sync: false  # e.g. https://your-app.vercel.app — set AFTER Vercel deploy
      - key: DATABASE_URL
        sync: false  # same value as in your local .env
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false  # generate: node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
      - key: ENCRYPTION_KEY
        sync: false  # 32 bytes base64: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"

  - type: worker
    name: eventrelay-worker
    plan: starter
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false  # MUST match the API service exactly

  - type: worker
    name: eventrelay-dispatcher
    plan: starter
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    # No dockerCommand (single-string parsing breaks argv flags).
    # Mode comes from this env var instead (worker.js reads WORKER_MODE).
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: dispatcher
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
